workflows:
  ios-workflow:
    name: iOS Workflow
    integrations:
      app_store_connect: "Rasty" # دڵنیابە ئەم ناوە ڕێک وەک ئەو ناوەیە کە لە Settings داتناوە
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rahmaty.rahmaty
      vars:
        APP_STORE_APPLE_ID: 6758720089
      flutter: stable
    scripts:
      - name: Build Flutter IPA
        script: |
          flutter build ipa --release --export-options-plist=$CM_EXPORT_OPTIONS_CONFIG_PATH
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
