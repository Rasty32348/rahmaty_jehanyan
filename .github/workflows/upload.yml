name: Upload to App Store
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download IPA from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # دابەزاندنی هەموو فایلەکان بۆ ئەوەی دڵنیا بین فایلەکە لێرەیە
          gh release download v1.0 --pattern "*.ipa"
          # گۆڕینی ناوی هەر فایلێکی ipa کە هەبێت بۆ ناوێکی سادە
          mv *.ipa upload_me.ipa
          # نیشاندانی قەبارەی فایلەکە بۆ دڵنیایی لەوەی دابەزیوە
          ls -lh upload_me.ipa

      - name: Upload IPA to App Store
        run: |
          # بەکارهێنانی فەرمانی نوێی ئەپڵ بۆ ناردن
          xcrun altool --upload-app --type ios \
            --file "upload_me.ipa" \
            --username "rastykhalid756@gmail.com" \
            --password "${{ secrets.APPLE_PASSWORD }}" \
            --show-progress
