name: Upload to App Store
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download IPA from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0 --pattern "rahmaty_jehanyan.ipa"

      - name: Upload IPA to App Store
        run: |
          xcrun altool --upload-app --type ios --file "rahmaty_jehanyan.ipa" --username "rastykhalid756@gmail.com" --password "${{ secrets.APPLE_PASSWORD }}"
