name: Upload to App Store
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download IPA from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # دابەزاندنی فایلەکە لە ڕیلیسی v1.5
          # بەکارهێنانی --pattern "*.ipa" بۆ ئەوەی هەر فایلێکی IPA هەبێت دایبگرێت
          gh release download v1.5 --pattern "*.ipa" --clobber
          
          # گۆڕینی ناوی فایلە دابەزیوەکە بۆ ناوێکی جێگیر بۆ ئەوەی هەڵە نەبێت
          mv *.ipa rahmaty_jehanyan.ipa
          
          # نیشاندانی قەبارە و زانیاری فایلەکە بۆ دڵنیایی لەوەی دابەزیوە
          ls -lh rahmaty_jehanyan.ipa

      - name: Upload IPA to App Store
        run: |
          # بەکارهێنانی altool بۆ ناردنی ئەپەکە
          # زیادکردنی --verbose بۆ ئەوەی وردەکاری زۆرتر بدات ئەگەر شکستی هێنا
          xcrun altool --upload-app --type ios \
            --file "rahmaty_jehanyan.ipa" \
            --username "rastykhalid756@gmail.com" \
            --password "${{ secrets.APPLE_PASSWORD }}" \
            --show-progress \
            --verbose
